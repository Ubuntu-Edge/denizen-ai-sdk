name: denizen_ai
description: A developer-friendly, cross-platform toolkit for offline AI on-device.
version: 0.0.1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.1
  shared_preferences: ^2.2.3
  http: ^1.1.0
  llama_flutter_android: 
    path: ./packages/llama_flutter_android
  connectivity_plus: ^6.1.0
  tflite_flutter: ^0.12.1
  sqlite3: ^2.4.3
  sqlite3_flutter_libs: ^0.5.21
  path: ^1.9.1
  record: ^6.2.1
  whisper_flutter_new: ^1.0.1
  speech_to_text: ^7.3.0
  flutter_tts: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.agilebiz.denizen_ai
        pluginClass: DenizenAiPlugin
  assets:
    - assets/models/
